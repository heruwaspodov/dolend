name: Verify and deploy Firebase Hosting

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosting-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
  NEXT_PUBLIC_POC_EVENT_FIXTURES: 'false'
  SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  ALLOWED_ORIGINS: http://localhost:3000,https://dolend.web.app
  POC_MODE: 'false'
  PLAYWRIGHT_CHANNEL: chromium

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.9
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run env:check:ci
      - run: pnpm run lint
      - run: pnpm run test:phone
      - run: pnpm run api:check && pnpm run api:test
      - run: pnpm run poc:check && pnpm run poc:test
      - run: pnpm run db:test
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:landing && pnpm run test:account && pnpm run test:participation
      - run: pnpm run ci:stamp && pnpm run ci:verify-export
      - name: Retain the verified static build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  deploy-api:
    name: Migrate database and deploy Supabase API
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: '2.122.0'
      - name: Apply pending Supabase migrations
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_API_READY: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          PGSSLMODE: require
        run: |
          if [[ "$SUPABASE_API_READY" != true || -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_URL in the GitHub production environment."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          project_ref = urlsplit(os.environ["NEXT_PUBLIC_SUPABASE_URL"]).hostname.split(".")[0]
          try:
              db = urlsplit(os.environ["SUPABASE_DB_URL"])
              valid = (
                  db.scheme in ("postgres", "postgresql")
                  and (db.hostname or "").endswith(".pooler.supabase.com")
                  and db.port == 5432
                  and db.username == f"postgres.{project_ref}"
                  and db.password not in (None, "", "[YOUR-PASSWORD]", "%5BYOUR-PASSWORD%5D")
                  and db.path == "/postgres"
                  and db.query in ("", "sslmode=require")
                  and not db.fragment
              )
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit("::error::SUPABASE_DB_URL must be the production project's Session pooler URI.")
          PY
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --yes
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
      - name: Deploy dolend-api
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN in the GitHub production environment."
            exit 1
          fi
          project_ref="${NEXT_PUBLIC_SUPABASE_URL#https://}"
          project_ref="${project_ref%.supabase.co}"
          supabase functions deploy dolend-api --project-ref "$project_ref" --use-api --yes
      - name: Verify dolend-api health
        shell: bash
        run: |
          headers=(-H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          if [[ "$SUPABASE_PUBLISHABLE_KEY" == eyJ* ]]; then
            headers+=(-H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY")
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 10 \
            "${headers[@]}" "$NEXT_PUBLIC_API_URL/health" | jq -e '.data.service == "dolend-api"'

  deploy:
    name: Deploy dolend.web.app
    needs: deploy-api
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://dolend.web.app/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.9
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # No build is repeated; installation is only for the locked Firebase CLI.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-site-${{ github.sha }}
          path: out/
      - run: pnpm run ci:verify-export
      - name: Authenticate using short-lived GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: dolend-apps
          workload_identity_provider: projects/231014996414/locations/global/workloadIdentityPools/dolend-github/providers/github-main
          service_account: dolend-hosting-ci@dolend-apps.iam.gserviceaccount.com
      - run: pnpm run hosting:deploy --non-interactive
      - run: pnpm run ci:verify-live
